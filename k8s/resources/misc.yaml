# 1) ROOT proxy - the only one with a virtualhost
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: scoring
  namespace: scoring
spec:
  virtualhost:
    fqdn: '*.com'
  includes:
    - name: score-child
      namespace: scoring
    - name: health-child
      namespace: scoring
    - name: grafana-child
      namespace: monitoring
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: score-child
  namespace: scoring
spec:
  routes:
    - conditions:
        - prefix: /score
      services:
        - name: scoring
          port: 8080

---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: health-child
  namespace: scoring
spec:
  routes:
    - conditions:
        - prefix: /health
      services:
        - name: scoring
          port: 8080

---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: grafana-child
  namespace: monitoring
spec:
  routes:
    - conditions:
        - prefix: /grafana
      services:
        - name: prometheus-grafana
          port: 80
