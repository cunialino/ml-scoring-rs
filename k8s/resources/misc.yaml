# 1) ROOT proxy - the only one with a virtualhost
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: global-root
  namespace: projectcontour   # wherever your Contour control plane lives
spec:
  includes:
    - name: score-child
      namespace: scoring
      conditions:
        - prefix: /score
    - name: scoring-root
      namespace: scoring
      conditions:
        - prefix: /
    - name: grafana-child
      namespace: monitoring
      conditions:
        - prefix: /grafana

---
# 2) CHILD proxy for /score
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: score-child
  namespace: scoring
spec:
  routes:
    - conditions:
        - prefix: /score
      services:
        - name: scoring
          port: 8080

---
# 3) CHILD proxy for /
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: scoring-root
  namespace: scoring
spec:
  routes:
    - conditions:
        - prefix: /
      services:
        - name: scoring
          port: 8080

---
# 4) CHILD proxy for /grafana
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: grafana-child
  namespace: monitoring
spec:
  routes:
    - conditions:
        - prefix: /grafana
      services:
        - name: prometheus-grafana
          port: 3000
