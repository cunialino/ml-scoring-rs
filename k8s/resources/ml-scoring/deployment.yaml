apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
  namespace: scoring
  labels:
    app: scoring
spec:
  selector:
    matchLabels:
      app: scoring
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: scoring
      labels:
        app: scoring
    spec:
      containers:
        - name: scoring
          image: ml-scoring-server:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 0.25
              memory: 200M
            limits:
              cpu: 0.25
              memory: 200M

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: FEATURES_WORKERS
              value: "1"
            - name: FEATURES_HOST
              value: "0.0.0.0"
          ports:
            - name: scoring
              containerPort: 8080
          volumeMounts:
            - name: rocksdb-volume
              mountPath: /usr/src/app/rocksdb
              readOnly: true
      volumes:
        - name: rocksdb-volume
          persistentVolumeClaim:
            claimName: features-db-pvc
