apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-notifier
  namespace: scoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: feature-notifier-role
  namespace: scoring
rules:
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: feature-notifier-binding
  namespace: scoring
subjects:
  - kind: ServiceAccount
    name: feature-notifier
    namespace: scoring
roleRef:
  kind: Role
  name: feature-notifier-role
  apiGroup: rbac.authorization.k8s.io
