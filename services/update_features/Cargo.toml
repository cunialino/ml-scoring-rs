[package]
name = "update_features"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3.31"
rand = "0.8.5"
rocksdb = "0.23.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.44.1", features = ["fs", "full", "macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json"] }
