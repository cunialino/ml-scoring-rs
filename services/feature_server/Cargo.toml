[package]
name = "feature_server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
actix-web-prometheus = "0.1.2"
parking_lot = "0.12.3"
rocksdb = "0.23.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tokio = { version = "1.45.1", features = ["time"] }
tracing = "0.1.40"
tracing-actix-web = "0.7.15"
tracing-subscriber = { version = "0.3.18", features = ["json"] }
xgb-rs = { git = "https://github.com/cunialino/xgb-rs.git", version = "0.1.0" }
